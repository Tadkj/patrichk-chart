<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monitor Binance - Gráfico</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0e14; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #161a25; border-bottom: 1px solid #2b3139; font-size: 13px;
    }
    .title-box { font-weight: 700; font-size: 14px; color: #f0b90b; }
    .legend { display: flex; gap: 10px; font-size: 11px; flex-wrap: wrap; }
    .badge { padding: 2px 6px; border-radius: 4px; background: #2b3139; }
    #chart { width: 100vw; height: calc(100vh - 42px); }
  </style>
</head>
<body>
  <div id="header">
    <div class="title-box" id="pair-title">Cargando...</div>
    <div class="legend" id="ema-legend"></div>
  </div>
  <div id="chart"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const params = new URLSearchParams(window.location.search);
    const symbol = (params.get("symbol") || "BTCUSDT").toUpperCase();
    const interval = params.get("interval") || "1h";
    const market = params.get("market") || "Futuros";
    const customEma = parseInt(params.get("ema") || "200", 10);

    document.getElementById("pair-title").innerText = `${symbol} · ${interval} (${market})`;

    const chartContainer = document.getElementById("chart");
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { type: "solid", color: "#0b0e14" }, textColor: "#b7bdc6" },
      grid: { vertLines: { color: "#1e2329" }, horzLines: { color: "#1e2329" } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: "#2b3139" },
      timeScale: { borderColor: "#2b3139", timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: "#0ecb81", downColor: "#f6465d",
      borderUpColor: "#0ecb81", borderDownColor: "#f6465d",
      wickUpColor: "#0ecb81", wickDownColor: "#f6465d"
    });

    function calcEMA(closes, times, period) {
      if (closes.length < period) period = closes.length;
      const k = 2 / (period + 1);
      let ema = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
      const result = [];
      for (let i = period - 1; i < closes.length; i++) {
        if (i >= period) ema = (closes[i] - ema) * k + ema;
        result.push({ time: times[i], value: ema });
      }
      return result;
    }

    async function loadData() {
      const baseUrl = market === "Spot"
        ? `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=350`
        : `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=350`;

      try {
        const res = await fetch(baseUrl);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          document.getElementById("pair-title").innerText = `Error cargando ${symbol}`;
          return;
        }

        const candles = [];
        const closes = [];
        const times = [];

        data.forEach(c => {
          const t = Math.floor(c[0] / 1000);
          const open = parseFloat(c[1]);
          const high = parseFloat(c[2]);
          const low = parseFloat(c[3]);
          const close = parseFloat(c[4]);
          candles.push({ time: t, open, high, low, close });
          closes.push(close);
          times.push(t);
        });

        candleSeries.setData(candles);

        // Configurar EMAs a dibujar
        const emasToDraw = [
          { period: customEma, color: "#00e676", width: 2, label: `EMA ${customEma} (Obj)` },
          { period: 200, color: "#ffeb3b", width: 2, label: "EMA 200" },
          { period: 50, color: "#29b6f6", width: 1, label: "EMA 50" },
          { period: 20, color: "#ab47bc", width: 1, label: "EMA 20" }
        ];

        const seen = new Set();
        const legendEl = document.getElementById("ema-legend");

        emasToDraw.forEach(cfg => {
          if (seen.has(cfg.period)) return;
          seen.add(cfg.period);
          const serieData = calcEMA(closes, times, cfg.period);
          const line = chart.addLineSeries({ color: cfg.color, lineWidth: cfg.width, priceLineVisible: false });
          line.setData(serieData);

          const lastVal = serieData[serieData.length - 1]?.value;
          if (lastVal) {
            const span = document.createElement("span");
            span.className = "badge";
            span.style.borderLeft = `3px solid ${cfg.color}`;
            span.innerText = `${cfg.label}: ${Number(lastVal.toPrecision(6))}`;
            legendEl.appendChild(span);
          }
        });

        chart.timeScale().fitContent();
      } catch (e) {
        document.getElementById("pair-title").innerText = `Error de red: ${e.message}`;
      }
    }

    loadData();
    window.addEventListener("resize", () => {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 42 });
    });
  </script>
</body>
</html>
